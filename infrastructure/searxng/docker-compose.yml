services:
  searxng:
    image: searxng/searxng:2024.12.26-7578e6c8b
    container_name: tavily-searxng
    ports:
      - "${SEARXNG_PORT:-8080}:8080"
    volumes:
      - ./config:/etc/searxng:rw
    restart: unless-stopped
    environment:
      - SEARXNG_BASE_URL=http://localhost:${SEARXNG_PORT:-8080}/
