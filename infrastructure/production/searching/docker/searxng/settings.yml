use_default_settings: true

general:
  instance_name: "tavily-clone-searxng"
  donation_url: false
  privacypolicy_url: false
  contact_url: false
  enable_metrics: false

server:
  # secret_key is intentionally not set here; provide it via the SEARXNG_SECRET env var.
  limiter: false
  image_proxy: false

search:
  autocomplete: "" # An empty value means you're not configuring an autocomplete service here.
  default_lang: "en-US"
  formats:
    - html # return html search page
    - json # return structred json

outgoing: # outgoing controll external search engines like google bing .
  request_timeout: 3.0
  max_request_timeout: 5.0
  pool_connections: 100 #Number of connection pools maintained.
  pool_maxsize: 20 # max connection in pool
  enable_http2: true # HTTP/2 can improve network efficiency because multiple requests can be handled over a connection.

engines: # which engines you want to explore
  # All active engines use the same weight so no single engine dominates the merged ranking.
  - name: google
    disabled: true

  - name: google cse
    disabled: true

  - name: bing
    disabled: false
    weight: 1.0

  - name: brave
    disabled: true
    weight: 1.0

  - name: duckduckgo
    disabled: false
    weight: 1.0

  - name: wikipedia
    disabled: false
    weight: 1.0

  # mojeek is marked inactive upstream in this SearXNG version (it needs a heavy
  # Proof-of-Work captcha), so this entry has no effect until upstream re-activates it.
  - name: mojeek
    disabled: true
    weight: 1.0

  # qwant exists in this SearXNG version and is disabled by default.
  - name: qwant
    disabled: true
    weight: 1.0

  # startpage is also inactive upstream here (Proof-of-Work captcha), so it is not enabled.
  - name: startpage
    disabled: true

  - name: wikidata
    disabled: true

  - name: yahoo
    disabled: true
