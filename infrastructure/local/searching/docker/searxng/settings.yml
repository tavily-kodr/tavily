use_default_settings:
  engines:
    keep_only:
      - duckduckgo
      - wikipedia
      - brave
      - google

server:
  secret_key: "${SEARXNG_SECRET:-dev_secret_key_tavily_searxng_must_be_32_chars_long_1234}"
  limiter: false # Disable rate limiting for programmatic API access

search:
  formats:
    - html
    - json

outgoing:
  request_timeout: 8.0
  useragent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36"

engines:
  - name: google
    engine: google_cse
    shortcut: g
    timeout: 6.0
    disabled: false
