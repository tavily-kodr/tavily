name: tavily-searching-local

services:
  searxng:
    container_name: tavily-searxng-core
    image: docker.io/searxng/searxng:${SEARXNG_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${SEARXNG_PORT:-8080}:8080"
    environment:
      - SEARXNG_BASE_URL=http://localhost:${SEARXNG_PORT:-8080}/
      - SEARXNG_SECRET=${SEARXNG_SECRET:-dev_secret_key_tavily_searxng_must_be_32_chars_long_1234}
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - searxng-data:/var/cache/searxng

  valkey:
    container_name: tavily-searxng-valkey
    image: docker.io/valkey/valkey:9-alpine
    command: valkey-server --save 30 1 --loglevel warning
    restart: unless-stopped
    volumes:
      - valkey-data:/data

  searching:
    build:
      context: ../../../..
      dockerfile: infrastructure/local/searching/docker/Dockerfile
    container_name: tavily-searching-dev
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      - PORT=${PORT:-3000}
      - NODE_ENV=development
      - SEARXNG_URL=${SEARXNG_URL:-http://searxng:8080}
      - SEARCH_TIMEOUT_MS=${SEARCH_TIMEOUT_MS:-5000}
      - MAX_RESULTS=${MAX_RESULTS:-10}
    depends_on:
      - searxng
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../../../domains/searching/src:/app/domains/searching/src
      - ../../../../domains/searching/test:/app/domains/searching/test
      - ../../../../packages/config/src:/app/packages/config/src
      - ../../../../packages/errors/src:/app/packages/errors/src
      - ../../../../packages/logger/src:/app/packages/logger/src
    restart: unless-stopped

volumes:
  searxng-data:
  valkey-data:
